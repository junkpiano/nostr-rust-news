name: Cross Compile

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          - runs_on: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - runs_on: macos-15-intel
            rust_target: x86_64-apple-darwin
          - runs_on: macos-latest
            rust_target: aarch64-apple-darwin
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: rustfmt

      - name: Install native build deps
        if: startsWith(matrix.runs_on, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Add Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail

          app_name="$(awk -F ' = ' '/^name =/ {gsub(/"/, "", $2); print $2; exit}' Cargo.toml)"
          version="$(awk -F ' = ' '/^version =/ {gsub(/"/, "", $2); print $2; exit}' Cargo.toml)"
          mkdir -p dist

          target="${{ matrix.rust_target }}"
          echo "==> Building $app_name $version for $target (native cargo)"
          if [[ "$target" == *"-unknown-linux-gnu" ]]; then
            # Avoid runtime libssl ABI mismatches across Linux distros.
            export OPENSSL_STATIC=1
          fi
          cargo build --release --target "$target"
          bin_path="target/$target/release/$app_name"
          if [ ! -f "$bin_path" ]; then
            echo "Missing binary: $bin_path" >&2
            exit 1
          fi
          out="dist/${app_name}-${version}-${target}.tar.gz"
          tar -C "target/$target/release" -czf "$out" "$app_name"
          echo "Wrote $out"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.rust_target }}
          path: dist/*.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
