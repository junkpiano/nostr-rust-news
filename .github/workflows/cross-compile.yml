name: Cross Compile

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: rustfmt

      - name: Install cross
        run: cargo install cross --locked

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail

          app_name="$(awk -F ' = ' '/^name =/ {gsub(/"/, "", $2); print $2; exit}' Cargo.toml)"
          version="$(awk -F ' = ' '/^version =/ {gsub(/"/, "", $2); print $2; exit}' Cargo.toml)"
          targets=("x86_64-unknown-linux-gnu" "aarch64-unknown-linux-gnu")

          mkdir -p dist

          for target in "${targets[@]}"; do
            echo "==> Building $app_name $version for $target"
            cross build --release --target "$target"

            bin_path="target/$target/release/$app_name"
            if [ ! -f "$bin_path" ]; then
              echo "Missing binary: $bin_path" >&2
              exit 1
            fi

            out="dist/${app_name}-${version}-${target}.tar.gz"
            tar -C "target/$target/release" -czf "$out" "$app_name"
            echo "Wrote $out"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.tar.gz

      - name: Publish GitHub Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
