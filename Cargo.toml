[package]
name = "nostr-rust-news"
version = "0.2.3"
edition = "2021"

[dependencies]
anyhow = "1"
dist = { git = "https://github.com/junkpiano/Dist.git", package = "dist", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }

[package.metadata.cross.target.x86_64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install -y pkg-config libssl-dev:$CROSS_DEB_ARCH"
]

[package.metadata.cross.target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install -y pkg-config libssl-dev:$CROSS_DEB_ARCH"
]

[dev-dependencies]
serde_json = "1"
